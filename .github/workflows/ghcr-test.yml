name: build-test-image

# Builds the credit-card branch as a multi-arch image and pushes it to this fork's GHCR namespace,
# so it can be swapped in for the upstream importer for end-to-end testing. This lives on the
# `test-image` branch only, to keep the PR branch (feature/credit-card-import) clean.
on:
  push:
    branches: [test-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/firefly-iii-fints-importer:cc-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
